<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon-dark.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root { --bg-main: #051221; }
      html, body { 
        background-color: var(--bg-main); 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
      }
      #root:empty { 
        display: flex; 
        flex-direction: column;
        align-items: center; 
        justify-content: center; 
        height: 100vh;
      }
      .splash-logo {
        width: 160px;
        height: auto;
        animation: pulse 2s infinite ease-in-out;
        color: #ffffff;
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.8; }
        50% { transform: scale(1.02); opacity: 1; }
        100% { transform: scale(0.98); opacity: 0.8; }
      }
    </style>
    <script>
      (function() {
        try {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
          document.body.style.backgroundColor = '#051221';
        } catch (e) {
          console.error('Theme initialization failed', e);
        }
      })();
    </script>
    <title>Lumora</title>
  </head>
  <body>
    <div id="root">
      <svg 
        class="splash-logo"
        viewBox="0 0 160 40" 
        fill="none" 
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M12 20L20 4L36 36L12 20Z" fill="#D4AF37" fill-opacity="0.4" />
        <path d="M28 20L20 4L12 36L28 20Z" fill="#D4AF37" fill-opacity="0.7" />
        <path d="M20 36L12 20L28 20L20 36Z" fill="#D4AF37" />
        <text
          x="44"
          y="27"
          font-family="system-ui, -apple-system, sans-serif"
          font-weight="800"
          font-size="24"
          letter-spacing="-0.03em"
          fill="currentColor"
        >
          Lumora
        </text>
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
